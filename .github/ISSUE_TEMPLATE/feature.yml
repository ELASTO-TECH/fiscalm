name: Feature request
description: An idea, or something missing.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: Describe the real situation, not the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you'd like fiscalm to do
    validations:
      required: true
  - type: textarea
    id: now
    attributes:
      label: How you handle it today
